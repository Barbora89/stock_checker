name: Stock Checker

on:
  schedule:
    # Běží každou celou hodinu od 13:00 do 22:00 UTC (pondělí až pátek)
    - cron: "0 13-22 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ZÍSKÁNÍ AKTUÁLNÍHO ČASU: Klíčové pro správné fungování cache v Actions
      - name: Get Current Timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # OPRAVENÁ CACHE: Nyní bude správně stahovat nejnovější stav a ukládat změny
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ steps.timestamp.outputs.date }}
          restore-keys: |
            alert-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check prices
        run: python stock_reminder.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # DOPLNĚNO: Tento řádek předá Pythonu informaci, že skript běží ručně
          GITHUB_EVENT_NAME: ${{ github.event_name }}


